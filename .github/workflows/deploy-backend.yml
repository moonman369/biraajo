name: Backend - build & deploy to Oracle VM

# Backend only. The frontend deploys through Vercel's Git integration (see frontend/vercel.json).
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the running one instead of cancelling it.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: biraajo-backend
  # Must match the published port in backend/docker-compose.yml.
  HOST_PORT: "8002"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile and import the app (no network)
        env:
          # Dummy values: importing server.py reads these but connects to nothing.
          MONGO_URL: mongodb://127.0.0.1:1
          DB_NAME: ci_test
          JWT_SECRET: ci-only
          ADMIN_EMAIL: ci@example.com
          ADMIN_PASSWORD: ci-only
        run: |
          python -m compileall -q server.py site_defaults.py
          python -c "import server; assert any(r.path == '/api/' for r in server.app.routes); print('app imports, /api/ route present')"

      # tests/*.py are HTTP integration tests against a running server and database, so they are not
      # run here. Unit tests that need no network or API keys belong in tests/unit/.
      - name: Unit tests
        run: |
          if ls tests/unit/test_*.py >/dev/null 2>&1; then
            cp .env.example .env   # tests/conftest.py requires a *_dev/*_test DB_NAME
            python -m pytest -q tests/unit
          else
            echo "::notice::No unit tests in backend/tests/unit - skipping."
          fi

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # Oracle VMs can be x86 or Ampere (ARM); build both so either can run the image.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required secrets and variables
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_APP_DIR: ${{ secrets.VM_APP_DIR }}
          MONGO_URL: ${{ secrets.MONGO_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          DB_NAME: ${{ vars.DB_NAME }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
        run: |
          missing=""
          for name in VM_HOST VM_USER VM_SSH_KEY VM_APP_DIR MONGO_URL JWT_SECRET ADMIN_EMAIL ADMIN_PASSWORD DB_NAME CORS_ORIGINS; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secrets/variables:$missing (see backend/DEPLOY.md)"
            exit 1
          fi
          echo "All required secrets and variables are set."

      - name: Check compose image and encode compose file
        id: compose
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          image="${REGISTRY}/${OWNER,,}/${IMAGE_NAME}"
          if ! grep -q "image: ${image}:" backend/docker-compose.yml; then
            echo "::error::backend/docker-compose.yml does not use ${image} (the image this workflow pushes)"
            exit 1
          fi
          echo "repo=${image}" >> "$GITHUB_OUTPUT"
          echo "b64=$(base64 -w0 backend/docker-compose.yml)" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VM_APP_DIR: ${{ secrets.VM_APP_DIR }}
          COMPOSE_B64: ${{ steps.compose.outputs.b64 }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          IMAGE_REPO: ${{ steps.compose.outputs.repo }}
          HOST_PORT: ${{ env.HOST_PORT }}
          # App configuration. Required: MONGO_URL DB_NAME JWT_SECRET ADMIN_EMAIL ADMIN_PASSWORD.
          # The rest is written only when set, so the app's own defaults still apply otherwise.
          APP_MONGO_URL: ${{ secrets.MONGO_URL }}
          APP_DB_NAME: ${{ vars.DB_NAME }}
          APP_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          APP_ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          APP_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          APP_CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          APP_PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          APP_UPI_ID: ${{ vars.UPI_ID }}
          APP_APP_NAME: ${{ vars.APP_NAME }}
          APP_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          APP_RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
          APP_RESEND_REPLY_TO: ${{ vars.RESEND_REPLY_TO }}
          APP_GOOGLE_SHEETS_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEETS_WEBHOOK_URL }}
          APP_EMERGENT_LLM_KEY: ${{ secrets.EMERGENT_LLM_KEY }}
          APP_CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          APP_CONTENT_BANK_FOLDER: ${{ vars.CONTENT_BANK_FOLDER }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          # Optional host-key pinning (recommended). Empty = not checked.
          fingerprint: ${{ secrets.VM_SSH_FINGERPRINT }}
          envs: GHCR_USER,GHCR_TOKEN,VM_APP_DIR,COMPOSE_B64,IMAGE_TAG,IMAGE_REPO,HOST_PORT,APP_MONGO_URL,APP_DB_NAME,APP_JWT_SECRET,APP_ADMIN_EMAIL,APP_ADMIN_PASSWORD,APP_CORS_ORIGINS,APP_PUBLIC_SITE_URL,APP_UPI_ID,APP_APP_NAME,APP_RESEND_API_KEY,APP_RESEND_FROM_EMAIL,APP_RESEND_REPLY_TO,APP_GOOGLE_SHEETS_WEBHOOK_URL,APP_EMERGENT_LLM_KEY,APP_CLOUDINARY_URL,APP_CONTENT_BANK_FOLDER
          command_timeout: 15m
          script: |
            set -euo pipefail

            if [ -z "${VM_APP_DIR:-}" ]; then
              echo "VM_APP_DIR secret is not set - refusing to guess a deploy path" >&2
              exit 1
            fi
            # Strip stray whitespace pasted into the secret and expand a leading ~.
            APP_DIR="$(printf '%s' "$VM_APP_DIR" | tr -d '[:space:]')"
            # shellcheck disable=SC2088  # matching a literal "~/" typed into the secret
            case "$APP_DIR" in
              "~") APP_DIR="$HOME" ;;
              "~/"*) APP_DIR="$HOME/${APP_DIR#\~/}" ;;
            esac
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # 1. Compose file from the repo.
            printf '%s' "$COMPOSE_B64" | base64 -d > docker-compose.yml

            # 2. .env from GitHub secrets/variables. Single-quoted values are taken literally by
            #    Compose (no $ interpolation), so a value must not contain ' or a newline.
            umask 077
            tmp="$(mktemp .env.XXXXXX)"
            put() { # put NAME VALUE [required]
              if [ -z "$2" ]; then
                if [ "${3:-}" = required ]; then echo "Required setting $1 is empty" >&2; rm -f "$tmp"; exit 1; fi
                return 0
              fi
              case "$2" in
                *"'"*|*$'\n'*) echo "Setting $1 contains a single quote or newline, which .env cannot hold" >&2; rm -f "$tmp"; exit 1 ;;
              esac
              printf "%s='%s'\n" "$1" "$2" >> "$tmp"
            }
            put IMAGE_TAG "$IMAGE_TAG" required
            put MONGO_URL "$APP_MONGO_URL" required
            put DB_NAME "$APP_DB_NAME" required
            put JWT_SECRET "$APP_JWT_SECRET" required
            put ADMIN_EMAIL "$APP_ADMIN_EMAIL" required
            put ADMIN_PASSWORD "$APP_ADMIN_PASSWORD" required
            put CORS_ORIGINS "$APP_CORS_ORIGINS"
            put PUBLIC_SITE_URL "$APP_PUBLIC_SITE_URL"
            put UPI_ID "$APP_UPI_ID"
            put APP_NAME "$APP_APP_NAME"
            put RESEND_API_KEY "$APP_RESEND_API_KEY"
            put RESEND_FROM_EMAIL "$APP_RESEND_FROM_EMAIL"
            put RESEND_REPLY_TO "$APP_RESEND_REPLY_TO"
            put GOOGLE_SHEETS_WEBHOOK_URL "$APP_GOOGLE_SHEETS_WEBHOOK_URL"
            put EMERGENT_LLM_KEY "$APP_EMERGENT_LLM_KEY"
            put CLOUDINARY_URL "$APP_CLOUDINARY_URL"
            put CONTENT_BANK_FOLDER "$APP_CONTENT_BANK_FOLDER"
            mv "$tmp" .env
            echo "Wrote $(wc -l < .env) settings to $APP_DIR/.env"

            # 3. Pull and start the image built for this commit.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker logout ghcr.io >/dev/null

            # Prune: dangling layers, plus old biraajo-backend images beyond the newest 3 (kept for
            # quick rollbacks). Other services' images on the VM are never touched.
            docker image prune -f
            docker images "$IMAGE_REPO" --format '{{.CreatedAt}}|{{.ID}}' \
              | sort -r | awk -F'|' '!seen[$2]++ {print $2}' \
              | tail -n +4 | xargs -r docker rmi 2>/dev/null || true

            # 4. Health gate: the container must report healthy and answer on the host port.
            #    A crash loop (e.g. database unreachable) never reaches "healthy", so wait for it.
            status=""
            for _ in $(seq 1 40); do
              status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' biraajo-backend 2>/dev/null || echo missing)"
              [ "$status" = healthy ] && break
              sleep 6
            done
            if [ "$status" != healthy ]; then
              echo "Container is not healthy after 240s (status: $status)" >&2
              docker compose ps >&2
              docker compose logs --tail 80 >&2
              exit 1
            fi
            if command -v curl >/dev/null 2>&1; then
              curl -fsS --max-time 10 "http://127.0.0.1:${HOST_PORT}/api/"
            else
              wget -qO- --timeout=10 "http://127.0.0.1:${HOST_PORT}/api/"
            fi
            echo
            docker compose ps
            echo "Deployed ${IMAGE_TAG}"
