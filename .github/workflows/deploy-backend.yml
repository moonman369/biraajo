name: Backend - build & deploy to Oracle VM

# Backend only. The frontend deploys through Vercel's Git integration (see frontend/vercel.json).
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the running one instead of cancelling it.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: biraajo-backend
  # Must match the published port in backend/docker-compose.yml.
  HOST_PORT: "8002"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile and import the app (no network)
        env:
          # Dummy values: importing server.py reads these but connects to nothing.
          MONGO_URL: mongodb://127.0.0.1:1
          DB_NAME: ci_test
          JWT_SECRET: ci-only
          ADMIN_EMAIL: ci@example.com
          ADMIN_PASSWORD: ci-only
        run: |
          python -m compileall -q server.py site_defaults.py
          python -c "import server; assert any(r.path == '/api/' for r in server.app.routes); print('app imports, /api/ route present')"

      # tests/*.py are HTTP integration tests against a running server and database, so they are not
      # run here. Unit tests that need no network or API keys belong in tests/unit/.
      - name: Unit tests
        run: |
          if ls tests/unit/test_*.py >/dev/null 2>&1; then
            cp .env.example .env   # tests/conftest.py requires a *_dev/*_test DB_NAME
            python -m pytest -q tests/unit
          else
            echo "::notice::No unit tests in backend/tests/unit - skipping."
          fi

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # Oracle VMs can be x86 or Ampere (ARM); build both so either can run the image.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # App settings (MONGO_URL, JWT_SECRET, ...) are NOT GitHub secrets: they live in .env on the VM.
      - name: Check required secrets
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_APP_DIR: ${{ secrets.VM_APP_DIR }}
        run: |
          missing=""
          for name in VM_HOST VM_USER VM_SSH_KEY VM_APP_DIR; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secrets:$missing (see backend/DEPLOY.md)"
            exit 1
          fi
          echo "All required secrets are set."

      - name: Check compose image and encode compose file
        id: compose
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          image="${REGISTRY}/${OWNER,,}/${IMAGE_NAME}"
          if ! grep -q "image: ${image}:" backend/docker-compose.yml; then
            echo "::error::backend/docker-compose.yml does not use ${image} (the image this workflow pushes)"
            exit 1
          fi
          echo "repo=${image}" >> "$GITHUB_OUTPUT"
          echo "b64=$(base64 -w0 backend/docker-compose.yml)" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VM_APP_DIR: ${{ secrets.VM_APP_DIR }}
          COMPOSE_B64: ${{ steps.compose.outputs.b64 }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          IMAGE_REPO: ${{ steps.compose.outputs.repo }}
          HOST_PORT: ${{ env.HOST_PORT }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          # Optional host-key pinning (recommended). Empty = not checked.
          fingerprint: ${{ secrets.VM_SSH_FINGERPRINT }}
          envs: GHCR_USER,GHCR_TOKEN,VM_APP_DIR,COMPOSE_B64,IMAGE_TAG,IMAGE_REPO,HOST_PORT
          command_timeout: 15m
          script: |
            set -euo pipefail

            if [ -z "${VM_APP_DIR:-}" ]; then
              echo "VM_APP_DIR secret is not set - refusing to guess a deploy path" >&2
              exit 1
            fi
            # Strip stray whitespace pasted into the secret and expand a leading ~.
            APP_DIR="$(printf '%s' "$VM_APP_DIR" | tr -d '[:space:]')"
            # shellcheck disable=SC2088  # matching a literal "~/" typed into the secret
            case "$APP_DIR" in
              "~") APP_DIR="$HOME" ;;
              "~/"*) APP_DIR="$HOME/${APP_DIR#\~/}" ;;
            esac
            if [ ! -d "$APP_DIR" ]; then
              echo "Deploy dir $APP_DIR does not exist for user $(whoami). Do the one-time VM setup (backend/DEPLOY.md)." >&2
              exit 1
            fi
            cd "$APP_DIR"

            # 1. Compose file from the repo.
            printf '%s' "$COMPOSE_B64" | base64 -d > docker-compose.yml

            # 2. App settings live in .env on the VM, maintained by hand (backend/DEPLOY.md). The pipeline
            #    never writes them: it checks the required keys (names only, values are never printed)
            #    and sets IMAGE_TAG, leaving every other line as it is.
            if [ ! -f .env ]; then
              echo "$APP_DIR/.env does not exist. Create it on the VM first (backend/DEPLOY.md)." >&2
              exit 1
            fi
            missing=""
            for key in MONGO_URL DB_NAME JWT_SECRET ADMIN_EMAIL ADMIN_PASSWORD; do
              grep -Eq "^[[:space:]]*${key}[[:space:]]*=[[:space:]]*[^[:space:]]" .env || missing="$missing $key"
            done
            if [ -n "$missing" ]; then
              echo "Missing or empty in $APP_DIR/.env:$missing" >&2
              exit 1
            fi
            if ! grep -Eq "^[[:space:]]*CORS_ORIGINS[[:space:]]*=[[:space:]]*[^[:space:]]" .env; then
              echo "WARNING: CORS_ORIGINS is not set in .env, so the API accepts requests from any origin (*)." >&2
            fi
            tmp="$(mktemp .env.XXXXXX)"
            { grep -v '^IMAGE_TAG=' .env || true; printf "IMAGE_TAG='%s'\n" "$IMAGE_TAG"; } > "$tmp"
            cat "$tmp" > .env   # rewrite in place: keeps the file's owner and permissions
            rm -f "$tmp"

            # 3. Pull and start the image built for this commit.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker logout ghcr.io >/dev/null

            # Prune: dangling layers, plus old biraajo-backend images beyond the newest 3 (kept for
            # quick rollbacks). Other services' images on the VM are never touched.
            docker image prune -f
            docker images "$IMAGE_REPO" --format '{{.CreatedAt}}|{{.ID}}' \
              | sort -r | awk -F'|' '!seen[$2]++ {print $2}' \
              | tail -n +4 | xargs -r docker rmi 2>/dev/null || true

            # 4. Health gate: the container must report healthy and answer on the host port.
            #    A crash loop (e.g. database unreachable) never reaches "healthy", so wait for it.
            status=""
            for _ in $(seq 1 40); do
              status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' biraajo-backend 2>/dev/null || echo missing)"
              [ "$status" = healthy ] && break
              sleep 6
            done
            if [ "$status" != healthy ]; then
              echo "Container is not healthy after 240s (status: $status)" >&2
              docker compose ps >&2
              docker compose logs --tail 80 >&2
              exit 1
            fi
            if command -v curl >/dev/null 2>&1; then
              curl -fsS --max-time 10 "http://127.0.0.1:${HOST_PORT}/api/"
            else
              wget -qO- --timeout=10 "http://127.0.0.1:${HOST_PORT}/api/"
            fi
            echo
            docker compose ps
            echo "Deployed ${IMAGE_TAG}"
